name: Build NeuraL IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          xcodebuild -project NeuraL.xcodeproj \
            -scheme NeuraL \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath ./DerivedData \
            archive -archivePath ./NeuraL.xcarchive

          mkdir Payload
          cp -R ./NeuraL.xcarchive/Products/Applications/NeuraL.app Payload/
          zip -r NeuraL-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeuraL-unsigned
          path: NeuraL-unsigned.ipa
