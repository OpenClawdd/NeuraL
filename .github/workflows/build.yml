name: Build NeuraL IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Build llama.cpp for iOS (arm64)
        run: |
          cd llama.cpp
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=ON \
            -DLLAMA_ACCELERATE=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF
          cmake --build . --config Release -j$(sysctl -n hw.logicalcpu)

          mkdir -p ../../build/llama
          find . -name "libllama.a" -exec cp {} ../../build/llama/ \;
          find . -name "libggml*.a" -exec cp {} ../../build/llama/ \;
          cp -R ../include ../../build/llama/
          cp -R ../ggml/include ../../build/llama/

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          xcodebuild -project NeuraL.xcodeproj \
            -scheme NeuraL \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath ./DerivedData \
            archive -archivePath ./NeuraL.xcarchive

          mkdir Payload
          cp -R ./NeuraL.xcarchive/Products/Applications/NeuraL.app Payload/
          zip -r NeuraL-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeuraL-unsigned
          path: NeuraL-unsigned.ipa
