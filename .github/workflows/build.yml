      - name: Build llama.cpp for iOS (arm64)
        run: |
          cd llama.cpp
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=ON \
            -DLLAMA_ACCELERATE=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF
          cmake --build . --config Release -j$(sysctl -n hw.logicalcpu)

          # Copy the static libraries and headers to where the Xcode project expects them
          mkdir -p ../../build/llama
          find . -name "libllama.a" -exec cp {} ../../build/llama/ \;
          find . -name "libggml*.a" -exec cp {} ../../build/llama/ \;
          cp -R ../include ../../build/llama/
          cp -R ../ggml/include ../../build/llama/
