name: NeuraL
options:
  bundleIdPrefix: com.neural
  deploymentTarget:
    iOS: "17.0"

targets:
  NeuraL:
    type: application
    platform: iOS
    sources:
      - path: NeuraL
    info:
      path: NeuraL/Info.plist
    entitlements:
      path: Entitlements/NeuraL.entitlements
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Bridging/BridgingHeader.h
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Bridging
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Bridging
          - $(PROJECT_DIR)/build/llama/include
          - $(PROJECT_DIR)/build/llama/include/ggml
          - $(PROJECT_DIR)/llama.cpp/include
          - $(PROJECT_DIR)/llama.cpp/ggml/include
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/build/llama
        OTHER_LDFLAGS:
          - $(inherited)
          - -lllama
          - -lggml
          - -lggml-base
          - -lggml-cpu
          - -lggml-metal
          - -framework
          - Metal
          - -framework
          - Foundation
    dependencies:
      - framework: Accelerate.framework
      - framework: Metal.framework
      - framework: MetalKit.framework
      - framework: Speech.framework
      - framework: AVFoundation.framework
      - sdk: libc++.tbd

  NeuraLTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeuraLTests
    dependencies:
      - target: NeuraL

  NeuraLUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NeuraLUITests
    dependencies:
      - target: NeuraL
